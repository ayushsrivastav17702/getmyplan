name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 368039980286.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

      - name: Build and push backend
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/getmyplan-backend:latest \
            ./backend
          docker push $ECR_REGISTRY/getmyplan-backend:latest

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster getmyplan-prod \
            --service getmyplan-backend \
            --force-new-deployment \
            --region ap-south-1

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

      - name: Build and push frontend
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/getmyplan-frontend:latest \
            ./frontend
          docker push $ECR_REGISTRY/getmyplan-frontend:latest

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster getmyplan-prod \
            --service getmyplan-frontend \
            --force-new-deployment \
            --region ap-south-1
