server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://getmyplan-alb-624713750.ap-south-1.elb.amazonaws.com;
        proxy_set_header Host getmyplan-alb-624713750.ap-south-1.elb.amazonaws.com;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://getmyplan-alb-624713750.ap-south-1.elb.amazonaws.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
