        <!-- SCHEMA.ORG JSON-LD: SoftwareApplication (Global) -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "Getmyplan",
          "alternateName": "GetMyPlan",
          "url": "https://getmyplan.in",
          "description": "AI-powered demand forecasting with 91% accuracy for fashion retailers and D2C brands.",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "30000",
            "priceCurrency": "INR",
            "availability": "https://schema.org/OnlineOnly"
          },
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.9",
            "ratingCount": "127",
            "bestRating": "5"
          },
          "featureList": [
            "AI Demand Forecasting (91% accuracy)",
            "Buy Plan Generator",
            "Stock-Out Prediction",
            "Inventory Optimization",
            "Multi-Channel Analytics",
            "Automated Replenishment"
          ]
        }
        </script>

        <!-- SCHEMA.ORG JSON-LD: FAQPage -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How accurate is Getmyplan's demand forecasting?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Getmyplan uses a 3-model ensemble ML achieving 91% forecast accuracy."
              }
            },
            {
              "@type": "Question",
              "name": "How long does it take to get started?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "From zero to insights in 15 minutes. Just upload your 7 CSV files."
              }
            },
            {
              "@type": "Question",
              "name": "Does Getmyplan offer a free trial?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Getmyplan offers a 7-day free trial with no credit card required."
              }
            }
          ]
        }
        </script>

        <!-- SCHEMA.ORG JSON-LD: WebSite -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "url": "https://getmyplan.in",
          "name": "Getmyplan",
          "description": "AI-powered demand planning and inventory optimization for fashion retailers",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://getmyplan.in/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
        </script>

        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Product",
          "name": "Getmyplan Professional Plan",
          "description": "AI demand forecasting and buy plan generation for multi-channel retailers",
          "brand": {"@type": "Brand", "name": "Getmyplan"},
          "offers": [
            {"@type": "Offer", "name": "Starter Plan", "price": "30000", "priceCurrency": "INR", "description": "Up to 10 stores, 3 users, basic analytics"},
            {"@type": "Offer", "name": "Professional Plan", "price": "50000", "priceCurrency": "INR", "description": "Up to 50 stores, 10 users, AI forecasting, API access"},
            {"@type": "Offer", "name": "Enterprise Plan", "price": "100000", "priceCurrency": "INR", "description": "Unlimited stores, unlimited users, dedicated support"}
          ]
        }
        </script>

        <!-- SCHEMA.ORG JSON-LD: BreadcrumbList -->

        </script>
